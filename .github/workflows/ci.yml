name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2' }
      - name: PHP lint
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: No secrets committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|aa360-config\.php$'; then echo "Archivo secreto en el repo"; exit 1; fi
          if git grep -nE '(sk|rk)_(live|test)_[A-Za-z0-9]{10,}|whsec_[A-Za-z0-9]{10,}' -- . ':!*.md'; then echo "Llave en el código"; exit 1; fi
